<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Israel's Receipts</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Israel's Receipts</h1>
    <button id="viewReceiptsBtn">See Previous Receipts</button>
  </header>
  <main>
    <section id="createReceiptSection">
      <h2>Create New Receipt</h2>
      <form id="receiptForm">
        <div class="form-group">
          <input type="text" id="businessName" placeholder="Business Name" required>
          <input type="text" id="businessOwner" placeholder="Business Owner Name" required>
        </div>
        <div class="form-group">
          <input type="text" id="customerName" placeholder="Customer Name" required>
          <input type="text" id="customerNumber" placeholder="Customer Number" required>
        </div>
        <div class="form-group">
          <input type="date" id="receiptDate" placeholder="Receipt Date">
          <input type="text" id="receiptFor" placeholder="For" required>
        </div>
        <div class="form-group" id="itemsGroup">
          <div class="item-row">
            <input type="text" class="itemDescription" placeholder="Item Description" required>
            <input type="number" class="itemAmount" placeholder="Amount" required>
            <button type="button" class="removeItemBtn" style="display:none;">Remove</button>
          </div>
        </div>
        <button type="button" id="addItemBtn" style="margin-bottom:1em;">Add Another Item</button>
        <button type="submit" id="generateBtn">Generate Receipt</button>
      </form>
    </section>
    <section id="afterGeneration" style="display:none;">
      <button id="viewReceiptBtn">View Receipt</button>
      <button id="sendWhatsappBtn">Send Via WhatsApp</button>
      <button id="createAnotherBtn">Create Another Receipt</button>
    </section>
    <section id="receiptsListSection" style="display:none;">
      <h2>Previous Receipts</h2>
      <ul id="receiptsList"></ul>
      <button id="deleteAllBtn" style="margin-top:1em;background:#c0392b;">Delete All Receipts</button>
      <button id="backBtn" style="margin-top:1em;background:#888;">Back</button>
    </section>
  </main>
  <script src="main.js"></script>
</body>
</html>
